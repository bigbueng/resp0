<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub 连接器演示：任务小看板</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>🚀 你的第一个可交互 Demo</h1>
      <p class="subtitle">一个简洁的任务小看板：添加、勾选、删除，并自动统计完成率。</p>

      <section class="input-row" aria-label="添加任务区域">
        <input id="taskInput" type="text" placeholder="输入任务，例如：完成 README" />
        <button id="addBtn">添加任务</button>
      </section>

      <section class="stats" aria-live="polite">
        <span>总任务：<strong id="totalCount">0</strong></span>
        <span>已完成：<strong id="doneCount">0</strong></span>
        <span>完成率：<strong id="progress">0%</strong></span>
      </section>

      <ul id="taskList" class="task-list" aria-label="任务列表"></ul>

      <footer>
        <button id="clearDoneBtn" class="ghost">清除已完成</button>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
